<div class="container">

```
<header class="header">

    <h1>JOGO DA MEMÓRIA</h1>

    <p>
        Encontre os pares dos programas e ações da Ematerce
    </p>

</header>

<section class="painel">

    <div class="info">
        <span>Jogadas</span>
        <strong id="jogadas">0</strong>
    </div>

    <div class="info">
        <span>Tempo</span>
        <strong id="tempo">00:00</strong>
    </div>

    <div class="info">
        <span>Pares</span>
        <strong id="pares">0/9</strong>
    </div>

    <div class="info">
        <span>Recorde</span>
        <strong id="recorde">--</strong>
    </div>

</section>

<main id="game"></main>

<div class="acoes">
    <button onclick="startGame()">
        Reiniciar Jogo
    </button>
</div>

</div>
