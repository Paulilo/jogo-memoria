<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Ematerce</title>
    <link rel="icon" href="img/favicon.png">

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="page-bg">

    <header class="hero">

        <div class="hero-left">

            <img src="img/logo-ematerce.png"
                 alt="Ematerce"
                 class="logo-ematerce">

            <div class="hero-brand">
                <h2>EMATERCE</h2>
                <p>JOGO DA MEMÓRIA</p>
            </div>

        </div>

        <div class="hero-right">

            <h1>JOGO DA<br>MEMÓRIA</h1>

            <p>
                Encontre os pares dos programas e ações da Ematerce.
            </p>

        </div>

    </header>

    <section class="dashboard">

        <div class="card-info">
            <span>Jogadas</span>
            <strong id="jogadas">0</strong>
        </div>

        <div class="card-info">
            <span>Tempo</span>
            <strong id="tempo">00:00</strong>
        </div>

        <div class="card-info">
            <span>Melhor Resultado</span>
            <strong id="recorde">--</strong>
        </div>

        <div class="card-info">
            <span>Pares</span>
            <strong id="pares">0 / 8</strong>
        </div>

    </section>

    <main id="game"></main>

    <section class="actions">

        <button onclick="startGame()">
            Reiniciar Jogo
        </button>

    </section>

    <footer>

        <span>
            Desenvolvido para capacitação institucional Ematerce
        </span>

    </footer>

</div>

<div id="modal-vitoria" class="modal">

    <div class="modal-content">

        <h2>🏆 PARABÉNS!</h2>

        <p id="resultado-final"></p>

        <button onclick="fecharModal()">
            Jogar Novamente
        </button>

    </div>

</div>

<script src="script.js"></script>
```

</body>

</html>
